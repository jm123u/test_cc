<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraceQuarry Artifact View</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/ext/artifact_view.css">
</head>
<body>
  <header class="bar"><div class="bar-in">
    <a class="brand" href="/">TraceQuarry</a>
    <span class="here">Artifact View</span>
    <span class="host" id="host"></span>
    <a class="back" href="/">Back to workbench</a>
  </div></header>
  <div class="wrap" id="view" hidden>
    <nav id="nav" aria-label="Artifact categories"></nav>
    <main>
      <div>
        <h1 id="title"></h1>
        <p class="sub" id="sub"></p>
      </div>
      <div class="tools">
        <button class="chip" type="button" id="f-all" aria-pressed="true">All</button>
        <button class="chip" type="button" id="f-flag" aria-pressed="false">Flagged only</button>
        <input class="search" id="search" type="search" placeholder="Filter this category" aria-label="Filter this category">
        <span class="count" id="count"></span>
      </div>
      <div class="sheet"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
      <p class="foot" id="foot"></p>
    </main>
  </div>
  <div class="wrap single" id="picker" hidden>
    <main>
      <h1>Choose a completed case</h1>
      <p class="sub">The artifact view groups a parsed timeline by evidence category.</p>
      <div class="sheet"><table><thead><tr><th>Case</th><th>Completed</th><th>Events</th></tr></thead><tbody id="cases"></tbody></table></div>
    </main>
  </div>
  <div class="wrap single" id="message" hidden><main><h1 id="message-title"></h1><p class="sub" id="message-text"></p></main></div>
  <script src="/ext/artifact_view.js"></script>
</body>
</html>
